<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Namora comigo? 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe4ee;--bg2:#ffc2d9;--card:#ffffffcc;--ink:#7a1f4a;--pink:#ff4d8d;--pink2:#ff2d78;--soft:#ffd0e2;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#2a0f1e;--bg2:#4a1630;--card:#3a1426cc;--ink:#ffd9e8;--soft:#6b2748}
}
:root[data-theme="dark"]{--bg1:#2a0f1e;--bg2:#4a1630;--card:#3a1426cc;--ink:#ffd9e8;--soft:#6b2748}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);
  font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
  display:grid;place-items:center;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.card{
  position:relative;z-index:2;width:min(92vw,440px);padding:32px 24px 36px;text-align:center;
  background:var(--card);border-radius:36px;backdrop-filter:blur(8px);
  box-shadow:0 20px 60px #ff4d8d40;
}
h1{font-size:clamp(28px,7vw,38px);line-height:1.15;margin:10px 0 6px;font-weight:700}
.dica{min-height:28px;font-size:19px;margin:0 0 18px;opacity:.85}
.heart{width:150px;height:auto;animation:beat 1.3s ease-in-out infinite;filter:drop-shadow(0 8px 14px #ff2d7860)}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.12)}28%{transform:scale(1)}42%{transform:scale(1.08)}}
.botoes{display:flex;justify-content:center;align-items:center;gap:22px;min-height:70px}
button{white-space:nowrap;font-family:inherit;font-weight:700;border:0;cursor:pointer;border-radius:999px;font-size:22px;padding:14px 30px}
#sim{
  background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;
  box-shadow:0 8px 20px #ff2d7855;transform:scale(var(--s,1));
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
}
#sim:hover{filter:brightness(1.06)}
#nao{background:var(--soft);color:var(--ink);transition:left .3s ease,top .3s ease}
#resposta{display:none}
.card.aceitou #pergunta{display:none}
.card.aceitou #resposta{display:block;animation:pop .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.card.aceitou .heart{width:190px;animation:beat .8s ease-in-out infinite}
.h,.f,.b{position:fixed;pointer-events:none;z-index:1;line-height:1}
.h{top:-8vh;animation:fall linear forwards;z-index:3}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(var(--sway,0px),112vh,0) rotate(var(--rot,200deg))}}
.f{bottom:-8vh;opacity:.35;animation:subir linear infinite}
@keyframes subir{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(var(--sway,0px),-115vh,0)}}
.b{z-index:4;animation:burst .9s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.f{display:none}.heart{animation:none}}
</style>
</head>
<body>

<main class="card" id="card">
  <svg class="heart" viewBox="0 0 100 92" aria-hidden="true">
    <path d="M50 88C20 64 4 46 4 28 4 14 15 4 28 4c9 0 17 5 22 13C55 9 63 4 72 4c13 0 24 10 24 24 0 18-16 36-46 60z" fill="#ff4d8d"/>
    <path d="M22 22c3-6 9-9 15-8" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".55"/>
    <circle cx="36" cy="44" r="5" fill="#4a1630"/><circle cx="64" cy="44" r="5" fill="#4a1630"/>
    <circle cx="37.5" cy="42.5" r="1.7" fill="#fff"/><circle cx="65.5" cy="42.5" r="1.7" fill="#fff"/>
    <ellipse cx="27" cy="55" rx="7" ry="4" fill="#ff9ec1"/><ellipse cx="73" cy="55" rx="7" ry="4" fill="#ff9ec1"/>
    <path d="M44 55q6 7 12 0" stroke="#4a1630" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </svg>

  <section id="pergunta">
    <h1 id="titulo">Você quer namorar comigo?</h1>
    <p class="dica" id="dica">Pensa com carinho 🥺</p>
    <div class="botoes">
      <button id="sim" type="button">Sim 💖</button>
      <span id="slot"><button id="nao" type="button">Não 😢</button></span>
    </div>
  </section>

  <section id="resposta">
    <h1>Eba!! 🥰</h1>
    <p class="dica" style="font-size:22px">Eu já sabia que você ia dizer sim.<br>Agora é oficial 💕</p>
  </section>
</main>

<script>
// ===== Se quiser personalizar, mude aqui =====
const NOME = '';   // ex.: 'Maria' -> "Maria, você quer namorar comigo?"
// =============================================

const $ = id => document.getElementById(id);
const card = $('card'), sim = $('sim'), nao = $('nao'), slot = $('slot'), dica = $('dica');
if (NOME) $('titulo').textContent = NOME + ', você quer namorar comigo?';

const frases = ['Tem certeza? 🥺','Pensa direitinho...','Olha esse coraçãozinho 🥹','Não vale fugir!',
                'Última chance 💔','Clica no SIM 😌','Eu sei que você quer 😏','Vai, só um cliquezinho 💗'];
let solto = false, n = 0, ultimo = 0, escala = 1;

function crescer(){
  escala = Math.min(escala + 0.13, innerWidth < 500 ? 1.45 : 2.1);
  sim.style.setProperty('--s', escala);
  dica.textContent = frases[n++ % frases.length];
}

function fugir(x, y){
  const agora = performance.now();
  if (agora - ultimo < 140) return;
  ultimo = agora;

  const r = nao.getBoundingClientRect();
  if (!solto){                                   // primeira vez: sai do fluxo da página
    slot.style.display = 'inline-block';
    slot.style.width = r.width + 'px';
    slot.style.height = r.height + 'px';
    document.body.appendChild(nao);              // fora do card (backdrop-filter quebra o position:fixed)
    nao.style.position = 'fixed';
    nao.style.left = r.left + 'px';
    nao.style.top = r.top + 'px';
    nao.style.zIndex = 5;
    nao.offsetWidth;                             // força reflow p/ animar
    solto = true;
  }

  const w = r.width, h = r.height, m = 16;
  const topo = m + 12;
  const s = sim.getBoundingClientRect();
  const maxX = innerWidth - w - m, maxY = innerHeight - h - m;
  let melhor = null, melhorD = -1;

  for (let i = 0; i < 50; i++){
    const nx = m + Math.random() * Math.max(maxX - m, 1);
    const ny = topo + Math.random() * Math.max(maxY - topo, 1);
    const bate = nx < s.right + 18 && nx + w > s.left - 18 && ny < s.bottom + 18 && ny + h > s.top - 18;
    if (bate) continue;
    const d = Math.hypot(nx + w / 2 - x, ny + h / 2 - y);
    if (d > melhorD){ melhorD = d; melhor = {nx, ny}; if (d > 170) break; }
  }
  if (!melhor) melhor = {nx: maxX, ny: maxY};
  nao.style.left = melhor.nx + 'px';
  nao.style.top = melhor.ny + 'px';
  crescer();
}

// O "Não" nunca chega a ser clicado: foge no mouse, no toque e no teclado
nao.addEventListener('pointerenter', e => fugir(e.clientX, e.clientY));
nao.addEventListener('pointerdown', e => { e.preventDefault(); fugir(e.clientX, e.clientY); });
nao.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0]; fugir(t.clientX, t.clientY);
}, {passive: false});
nao.addEventListener('click', e => { e.preventDefault(); fugir(e.clientX, e.clientY); });
nao.addEventListener('focus', () => fugir(innerWidth / 2, innerHeight / 2));
document.addEventListener('pointermove', e => {  // foge antes mesmo de encostar
  if (e.pointerType !== 'mouse' || !solto) return;
  const r = nao.getBoundingClientRect();
  if (Math.hypot(r.left + r.width / 2 - e.clientX, r.top + r.height / 2 - e.clientY) < 75) fugir(e.clientX, e.clientY);
});
addEventListener('resize', () => {
  if (!solto) return;
  const r = nao.getBoundingClientRect();
  nao.style.left = Math.min(Math.max(r.left, 8), innerWidth - r.width - 8) + 'px';
  nao.style.top = Math.min(Math.max(r.top, 8), innerHeight - r.height - 8) + 'px';
});

// ===== Animações fofas =====
const EMOJIS = ['💖','💕','💗','💘','🌸','✨','🩷'];
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = () => EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

function chover(){
  const el = document.createElement('span');
  el.className = 'h';
  el.textContent = pick();
  el.style.left = rnd(0, 100) + 'vw';
  el.style.fontSize = rnd(18, 42) + 'px';
  el.style.setProperty('--sway', rnd(-60, 60) + 'px');
  el.style.setProperty('--rot', rnd(-240, 240) + 'deg');
  el.style.animationDuration = rnd(3.5, 6.5) + 's';
  el.addEventListener('animationend', () => el.remove());
  document.body.appendChild(el);
}

function rajada(x, y){
  for (let i = 0; i < 26; i++){
    const el = document.createElement('span');
    el.className = 'b';
    el.textContent = pick();
    const ang = (Math.PI * 2 * i) / 26 + rnd(-.15, .15), dist = rnd(110, 260);
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.fontSize = rnd(18, 34) + 'px';
    el.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    el.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    el.addEventListener('animationend', () => el.remove());
    document.body.appendChild(el);
  }
}

// corações de fundo, bem suaves
for (let i = 0; i < 14; i++){
  const el = document.createElement('span');
  el.className = 'f';
  el.textContent = ['💗','🩷','💕'][i % 3];
  el.style.left = rnd(0, 100) + 'vw';
  el.style.fontSize = rnd(16, 34) + 'px';
  el.style.setProperty('--sway', rnd(-40, 40) + 'px');
  el.style.animationDuration = rnd(9, 18) + 's';
  el.style.animationDelay = -rnd(0, 14) + 's';
  document.body.appendChild(el);
}

sim.addEventListener('click', e => {
  const r = sim.getBoundingClientRect();
  card.classList.add('aceitou');
  nao.style.display = 'none';
  rajada(e.clientX || r.left + r.width / 2, e.clientY || r.top + r.height / 2);
  for (let i = 0; i < 40; i++) setTimeout(chover, i * 70);
  setInterval(chover, 320);                       // chuva de corações contínua
});
</script>
</body>
</html>
